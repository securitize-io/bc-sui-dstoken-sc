[package]
name = "securitize"
edition = "2024" # edition = "legacy" to use legacy (pre-2024) Move

[dependencies]
pas = { git = "https://github.com/MystenLabs/pas.git", subdir = "packages/pas", rev = "main" }
ptb = { git = "https://github.com/MystenLabs/pas.git", subdir = "packages/ptb", rev = "main" }

[environments]
testnet_alpha = "4c78adac"
testnet_beta = "4c78adac"
testnet_gamma = "4c78adac"

[dep-replacements.testnet_alpha]
pas = { use-environment = "testnet" }
ptb = { use-environment = "testnet" }

[dep-replacements.testnet_beta]
pas = { use-environment = "testnet" }
ptb = { use-environment = "testnet" }

[dep-replacements.testnet_gamma]
pas = { use-environment = "testnet" }
ptb = { use-environment = "testnet" }
